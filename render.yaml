# Render blueprint - deploys this repo as a public web service.
#
# The API key is deliberately NOT in this file. `sync: false` makes Render
# prompt for it once and store it as a secret, so it never enters the repository.
services:
  - type: web
    name: mi-report-copilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      # The password that unlocks the application. The default in auth.py is
      # committed to a public repository and is therefore public knowledge, so
      # the deployed instance sets its own. Render asks for it once and keeps
      # it as a secret.
      - key: APP_PASSWORD
        sync: false
      # Signs the session cookie. Generated by Render, so it is never in the
      # repository. Changing it signs everyone out.
      - key: APP_SECRET
        generateValue: true
      # matplotlib needs a writable config directory on a read-only-ish host.
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
